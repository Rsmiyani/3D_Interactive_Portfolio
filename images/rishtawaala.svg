<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#12061a"/>
      <stop offset="100%" stop-color="#1a0416"/>
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    
    <!-- Glassmorphism Filters -->
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    
    <!-- Glow Effect -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- Grid Pattern -->
  <g opacity="0.07">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 0,500 L 800,500 M 0,550 L 800,550" stroke="#ffffff" stroke-width="1"/>
    <path d="M 50,0 L 50,600 M 100,0 L 100,600 M 150,0 L 150,600 M 200,0 L 200,600 M 250,0 L 250,600 M 300,0 L 300,600 M 350,0 L 350,600 M 400,0 L 400,600 M 450,0 L 450,600 M 500,0 L 500,600 M 550,0 L 550,600 M 600,0 L 600,600 M 650,0 L 650,600 M 700,0 L 700,600 M 750,0 L 750,600" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Abstract Matching Constellation -->
  <g opacity="0.3">
    <!-- Connecting network lines -->
    <line x1="250" y1="200" x2="400" y2="150" stroke="url(#pink-glow)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="400" y1="150" x2="550" y2="220" stroke="url(#purple-glow)" stroke-width="1.5"/>
    <line x1="550" y1="220" x2="500" y2="380" stroke="url(#cyber-cyan)" stroke-width="1.5"/>
    <line x1="500" y1="380" x2="300" y2="420" stroke="url(#pink-glow)" stroke-width="2" filter="url(#neon-glow)"/>
    <line x1="300" y1="420" x2="250" y2="200" stroke="url(#purple-glow)" stroke-width="1"/>
    <line x1="400" y1="150" x2="300" y2="420" stroke="url(#cyber-cyan)" stroke-width="1.5"/>
    
    <!-- Constellation Nodes -->
    <circle cx="250" cy="200" r="4" fill="#ff3366"/>
    <circle cx="400" cy="150" r="6" fill="#00e5ff" filter="url(#neon-glow)"/>
    <circle cx="550" cy="220" r="5" fill="#7000ff"/>
    <circle cx="500" cy="380" r="4" fill="#ff00cc"/>
    <circle cx="300" cy="420" r="7" fill="#00e5ff" filter="url(#neon-glow)"/>
  </g>

  <!-- Central Verification / Match Hub -->
  <circle cx="400" cy="300" r="130" fill="url(#purple-glow)" opacity="0.05" filter="url(#neon-glow)"/>
  <circle cx="400" cy="300" r="100" fill="none" stroke="url(#pink-glow)" stroke-width="1.5" stroke-dasharray="10, 5" filter="url(#neon-glow)"/>
  <circle cx="400" cy="300" r="80" fill="none" stroke="url(#cyber-cyan)" stroke-width="2"/>

  <!-- Trust Shield Icon in Center -->
  <g transform="translate(370, 265) scale(1.2)" filter="url(#neon-glow)">
    <!-- Shield Outline -->
    <path d="M25,0 L45,10 L45,28 C45,40 37,50 25,55 C13,50 5,40 5,28 L5,10 Z" fill="none" stroke="url(#cyber-cyan)" stroke-width="3"/>
    <!-- DigiLocker Checkmark -->
    <path d="M15,26 L22,33 L35,17" fill="none" stroke="url(#pink-glow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="365" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#00e5ff" text-anchor="middle" letter-spacing="4" font-weight="900">IDENTITY VERIFIED</text>
  <text x="400" y="385" font-family="'Outfit', sans-serif" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="1">DigiLocker &amp; Face API Active</text>

  <!-- Floating UI Card Left - User Match card -->
  <g transform="translate(80, 150)">
    <!-- Glass Card background -->
    <rect width="200" height="130" rx="15" fill="#11111d" fill-opacity="0.75" stroke="url(#pink-glow)" stroke-width="1.5" filter="url(#neon-glow)"/>
    
    <!-- Match Percentage Badge -->
    <rect x="15" y="15" width="80" height="24" rx="12" fill="#ff3366" fill-opacity="0.2"/>
    <text x="55" y="31" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ff3366" font-weight="bold" text-anchor="middle">98% Match</text>
    
    <!-- User Info lines -->
    <text x="15" y="65" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#ffffff" font-weight="bold">Rohan Sharma</text>
    <text x="15" y="85" font-family="'Outfit', sans-serif" font-size="11" fill="#ffffff" opacity="0.6">SDE • Mumbai, IN</text>
    
    <!-- Status Dot -->
    <circle cx="20" cy="107" r="4" fill="#00e5ff" filter="url(#neon-glow)"/>
    <text x="32" y="110" font-family="'Outfit', sans-serif" font-size="10" fill="#00e5ff" font-weight="bold">ACTIVE NOW</text>
  </g>

  <!-- Floating UI Card Right - Moderation & Support Tickets -->
  <g transform="translate(520, 320)">
    <!-- Glass Card background -->
    <rect width="210" height="150" rx="15" fill="#0e0e18" fill-opacity="0.8" stroke="url(#cyber-cyan)" stroke-width="1.5" filter="url(#neon-glow)"/>
    
    <!-- Header -->
    <text x="15" y="30" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#00e5ff" font-weight="900" letter-spacing="1">MODERATION PANEL</text>
    
    <!-- Chart / Active metrics -->
    <rect x="15" y="45" width="180" height="1" fill="#ffffff" opacity="0.15"/>
    
    <!-- Stats items -->
    <text x="15" y="70" font-family="'Outfit', sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Pending Screenings:</text>
    <text x="195" y="70" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="end">0</text>
    
    <text x="15" y="95" font-family="'Outfit', sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Active Support Tickets:</text>
    <text x="195" y="95" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ff3366" font-weight="bold" text-anchor="end">2 Active</text>
    
    <!-- Action button shape -->
    <rect x="15" y="112" width="180" height="25" rx="5" fill="#7000ff" fill-opacity="0.3" stroke="#7000ff" stroke-width="1"/>
    <text x="105" y="128" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle" letter-spacing="1">RESOLVE QUEUES</text>
  </g>

  <!-- Live Face Verification Indicator (Floating Screen Top Right) -->
  <g transform="translate(540, 80)">
    <rect width="180" height="70" rx="12" fill="#150820" fill-opacity="0.8" stroke="#7000ff" stroke-width="1"/>
    <!-- Face Scan Icon -->
    <path d="M 20,20 L 35,20 M 20,20 L 20,35 M 50,20 L 35,20 M 50,20 L 50,35 M 20,50 L 20,35 M 20,50 L 35,50 M 50,50 L 35,50 M 50,50 L 50,35" stroke="#00e5ff" stroke-width="1.5" fill="none"/>
    <circle cx="35" cy="35" r="8" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <!-- Scanner Bar -->
    <line x1="18" y1="35" x2="52" y2="35" stroke="#ff3366" stroke-width="1.5" filter="url(#neon-glow)"/>
    
    <text x="65" y="32" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ffffff" font-weight="bold">FACE-API LIVE</text>
    <text x="65" y="48" font-family="'Outfit', sans-serif" font-size="9" fill="#00e5ff" font-weight="bold">ANALYSIS: 99.8% OK</text>
  </g>

  <!-- Bottom Details -->
  <text x="50" y="540" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#ffffff" font-weight="900" letter-spacing="-0.5">RISHTAWAALA</text>
  <text x="50" y="560" font-family="'Outfit', sans-serif" font-size="13" fill="#ff3366" font-weight="bold">NEXT.JS / EXPRESS / POSTGRESQL / WEB-SOCKETS</text>
</svg>
