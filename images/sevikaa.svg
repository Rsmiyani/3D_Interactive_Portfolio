<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020912"/>
      <stop offset="50%" stop-color="#051524"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- Radial Light Aura behind map -->
  <circle cx="500" cy="280" r="250" fill="#00e5ff" opacity="0.03" filter="url(#neon-glow)"/>

  <!-- Grid Pattern representing Geolocation coordinates -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 0,500 L 800,500 M 0,550 L 800,550"/>
    <path d="M 50,0 L 50,600 M 100,0 L 100,600 M 150,0 L 150,600 M 200,0 L 200,600 M 250,0 L 250,600 M 300,0 L 300,600 M 350,0 L 350,600 M 400,0 L 400,600 M 450,0 L 450,600 M 500,0 L 500,600 M 550,0 L 550,600 M 600,0 L 600,600 M 650,0 L 650,600 M 700,0 L 700,600 M 750,0 L 750,600"/>
  </g>

  <!-- Stylized Vector Map Paths in Background -->
  <g opacity="0.12" fill="none" stroke="#00e5ff" stroke-width="2">
    <!-- Map streets -->
    <path d="M 300,0 C 320,150 280,300 350,450 C 380,520 450,560 500,600"/>
    <path d="M 0,220 C 200,200 400,250 600,210 C 700,190 750,150 800,130"/>
    <path d="M 0,400 C 150,380 300,420 500,390 C 650,360 720,440 800,480"/>
    <path d="M 550,0 C 530,150 580,350 520,500 L 480,600"/>
    <!-- Diagonal lanes -->
    <line x1="0" y1="0" x2="800" y2="600" stroke-dasharray="8,8"/>
    <line x1="800" y1="0" x2="0" y2="600" stroke-dasharray="8,8"/>
  </g>

  <!-- Live Provider Map Pins & Tracking Waves -->
  <!-- Pin 1: Center Target Helper -->
  <g transform="translate(450, 260)">
    <!-- Broadcast Waves -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4" filter="url(#neon-glow)">
      <animate attributeName="r" values="10;45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="url(#cyan-glow)" filter="url(#neon-glow)"/>
    
    <!-- Map Pin shape -->
    <path d="M 0,0 C -10,-10 -15,-25 0,-35 C 15,-25 10,-10 0,0" fill="url(#purple-pink)" filter="url(#neon-glow)"/>
    <circle cx="0" cy="-22" r="5" fill="#ffffff"/>
  </g>

  <!-- Pin 2: Nearby Helper -->
  <g transform="translate(580, 180)">
    <circle cx="0" cy="0" r="6" fill="#00e5ff" filter="url(#neon-glow)"/>
    <path d="M 0,0 C -6,-6 -9,-15 0,-21 C 9,-15 6,-6 0,0" fill="#00e5ff"/>
  </g>
  
  <!-- Pin 3: Nearby Helper 2 -->
  <g transform="translate(340, 380)">
    <circle cx="0" cy="0" r="6" fill="#00e5ff" filter="url(#neon-glow)"/>
    <path d="M 0,0 C -6,-6 -9,-15 0,-21 C 9,-15 6,-6 0,0" fill="#00e5ff"/>
  </g>

  <!-- Left Sidebar Panel - Booking Dashboard & Task Mixer -->
  <g transform="translate(60, 60)">
    <!-- Glassmorphic Container -->
    <rect width="250" height="420" rx="20" fill="#0b131e" fill-opacity="0.8" stroke="url(#cyan-glow)" stroke-width="1.5" filter="url(#neon-glow)"/>
    
    <text x="20" y="35" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#00e5ff" font-weight="900" letter-spacing="2">SEVIKAA SERVICES</text>
    <rect x="20" y="50" width="210" height="1" fill="#ffffff" opacity="0.15"/>
    
    <!-- Location Pin Status -->
    <text x="20" y="75" font-family="'Outfit', sans-serif" font-size="11" fill="#ffffff" opacity="0.6">CURRENT PINNED LOCATION</text>
    <text x="20" y="95" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Rajkot, Gujarat, India</text>
    
    <!-- Task Combinator UI -->
    <text x="20" y="135" font-family="'Outfit', sans-serif" font-size="11" fill="#ffffff" opacity="0.6">SELECTED TASKS</text>
    
    <!-- Task Chips -->
    <g transform="translate(20, 150)">
      <rect width="95" height="26" rx="13" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1"/>
      <text x="47.5" y="17" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#00e5ff" font-weight="bold" text-anchor="middle">Cleaning +</text>
    </g>
    <g transform="translate(125, 150)">
      <rect width="90" height="26" rx="13" fill="#ff3366" fill-opacity="0.15" stroke="#ff3366" stroke-width="1"/>
      <text x="45" y="17" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#ff3366" font-weight="bold" text-anchor="middle">Cooking +</text>
    </g>
    <g transform="translate(20, 185)">
      <rect width="110" height="26" rx="13" fill="#7000ff" fill-opacity="0.15" stroke="#7000ff" stroke-width="1"/>
      <text x="55" y="17" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#7000ff" font-weight="bold" text-anchor="middle">Laundry +</text>
    </g>
    
    <!-- Helper Reliability & Availability Rating -->
    <text x="20" y="245" font-family="'Outfit', sans-serif" font-size="11" fill="#ffffff" opacity="0.6">RELIABILITY FILTER</text>
    <text x="20" y="270" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#ffffff" font-weight="bold">Score &gt; 92%</text>
    <!-- Simple progress bar representing rating -->
    <rect x="20" y="282" width="210" height="4" rx="2" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="20" y="282" width="180" height="4" rx="2" fill="url(#cyan-glow)" filter="url(#neon-glow)"/>

    <!-- Custom Availability Toggle -->
    <text x="20" y="325" font-family="'Outfit', sans-serif" font-size="11" fill="#ffffff" opacity="0.6">PROVIDER STATUS</text>
    <rect x="20" y="338" width="50" height="22" rx="11" fill="#00e5ff" fill-opacity="0.2" stroke="#00e5ff"/>
    <circle cx="59" cy="349" r="8" fill="#00e5ff" filter="url(#neon-glow)"/>
    <text x="80" y="353" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#00e5ff" font-weight="bold">REALTIME ACTIVE</text>
    
    <!-- Action Button -->
    <rect x="20" y="375" width="210" height="30" rx="15" fill="#ff3366" filter="url(#neon-glow)"/>
    <text x="125" y="394" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle" letter-spacing="1">FIND HELP NOW</text>
  </g>

  <!-- Right Dashboard Widget - Helper Earnings & Stats -->
  <g transform="translate(520, 360)">
    <!-- Mini Card -->
    <rect width="220" height="120" rx="15" fill="#090f19" fill-opacity="0.85" stroke="#7000ff" stroke-width="1.5" filter="url(#neon-glow)"/>
    
    <text x="15" y="25" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#7000ff" font-weight="900" letter-spacing="1">PROVIDER EARNINGS</text>
    <rect x="15" y="35" width="190" height="1" fill="#ffffff" opacity="0.1"/>
    
    <!-- Earnings stat -->
    <text x="15" y="65" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#ffffff" font-weight="bold">₹8,450<tspan font-size="11" font-family="'Outfit', sans-serif" font-weight="normal" fill="#00e5ff"> / week</tspan></text>
    
    <!-- Mini progress bar -->
    <text x="15" y="92" font-family="'Outfit', sans-serif" font-size="10" fill="#ffffff" opacity="0.6">Weekly Target Completed:</text>
    <text x="205" y="92" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#00e5ff" font-weight="bold" text-anchor="end">85%</text>
    <rect x="15" y="100" width="190" height="3" rx="1.5" fill="#ffffff" opacity="0.1"/>
    <rect x="15" y="100" width="160" height="3" rx="1.5" fill="#00e5ff"/>
  </g>

  <!-- Bottom Details -->
  <text x="50" y="540" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#ffffff" font-weight="900" letter-spacing="-0.5">SEVIKAA.COM</text>
  <text x="50" y="560" font-family="'Outfit', sans-serif" font-size="13" fill="#00e5ff" font-weight="bold">NEXT.JS / TS / SUPABASE (REALTIME &amp; RLS) / LEAFLET MAPS / BREVO SMTP</text>
</svg>
